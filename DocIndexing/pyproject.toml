[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docindexing"
version = "0.1.0"
description = "Local Confluence JSON + PDF indexing CLI using Ollama embeddings."
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
]

[project.scripts]
docindexing = "docindexing.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
